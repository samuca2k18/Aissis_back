services:
  # Backend do Iassis CRM
  iassis-backend:
    build: .
    container_name: iassis-backend
    restart: always
    network_mode: host
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Evolution API para WhatsApp
  evolution-api:
    image: atendai/evolution-api:v2.3.7
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configurações do Servidor
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://147.15.19.110:8080
      - LOG_LEVEL=error
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_AUTHENTICATION_API_KEY}
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      # Node.js Memory (1GB)
      - NODE_OPTIONS=--max-old-space-size=1024 --dns-result-order=ipv4first
      # Banco de dados PostgreSQL (Supabase)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_CONNECTION_URI}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      # Cache Local
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Versão do WhatsApp
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1035603224
      # Estabilidade v2
      - WEBSOCKET_ENABLED=true
      - WA_WEBSOCKET_ORDERLY=true
      # Webhooks Globais — desabilitado, usando webhook por instância no Manager UI
      - WEBHOOK_GLOBAL_ENABLED=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:


networks:
  default:
    driver: bridge
