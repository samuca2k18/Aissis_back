services:
  # Backend do Iassis CRM
  iassis-backend:
    build: .
    container_name: iassis-backend
    restart: always
    network_mode: host
    env_file:
      - .env

  # Evolution API para WhatsApp
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configurações do Servidor
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://64.181.181.86:8080
      - LOG_LEVEL=trace
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=MinhaChaveSegura2024xyz
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      # Node.js Memory
      - NODE_OPTIONS=--max-old-space-size=512 --dns-result-order=ipv4first
      # Banco de dados PostgreSQL (Supabase)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres.pyrfzttpihyttnzxplwp:Peixoto2004.@aws-1-sa-east-1.pooler.supabase.com:5432/postgres?schema=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      # Cache Local (sem Redis)
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      # Integrações Desabilitadas
      - CHATWOOT_ENABLED=false
      - OPENAI_ENABLED=false
      - DIFY_ENABLED=false
      - TYPEBOT_ENABLED=false
      - RABBITMQ_ENABLED=false
      - SQS_ENABLED=false
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_GLOBAL_EVENTS=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:


networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
