name: Backend CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect backend directory
        id: backend_dir
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "./app" ]; then
            DIR="."
          else
            CANDIDATE="$(find . -maxdepth 3 -type d -name app | head -n 1 | sed 's#/app$##')"
            if [ -z "${CANDIDATE:-}" ]; then
              echo "Could not find backend directory containing app/."
              exit 1
            fi
            DIR="$CANDIDATE"
          fi
          echo "backend_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Detected backend directory: $DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          ruff check app tests

      - name: Mypy
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          mypy app

      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          pytest -q

  deploy_oracle:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Validate deploy secrets
        shell: bash
        env:
          ORACLE_VM_HOST: ${{ secrets.ORACLE_VM_HOST }}
          ORACLE_VM_USER: ${{ secrets.ORACLE_VM_USER }}
          ORACLE_VM_SSH_KEY: ${{ secrets.ORACLE_VM_SSH_KEY }}
          ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for key in ORACLE_VM_HOST ORACLE_VM_USER ORACLE_VM_SSH_KEY ORACLE_APP_DIR; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing required secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy on VM via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ${{ secrets.ORACLE_VM_USER }}
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          command_timeout: 30m
          request_pty: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.ORACLE_APP_DIR }}"
            BRANCH="${{ github.ref_name }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Diretorio do backend nao encontrado ou sem .git: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"

            sudo docker compose up -d --build iassis-backend

            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                echo "Healthcheck OK"
                exit 0
              fi
              echo "Aguardando backend subir... tentativa $i/6"
              sleep 10
            done

            echo "Backend nao respondeu no /health apos o deploy."
            exit 1
