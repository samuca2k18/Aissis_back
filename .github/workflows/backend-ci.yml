name: Backend CI

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect backend directory
        id: backend_dir
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "./app" ]; then
            DIR="."
          else
            CANDIDATE="$(find . -maxdepth 3 -type d -name app | head -n 1 | sed 's#/app$##')"
            if [ -z "${CANDIDATE:-}" ]; then
              echo "Could not find backend directory containing app/."
              exit 1
            fi
            DIR="$CANDIDATE"
          fi
          echo "backend_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Detected backend directory: $DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          ruff check app tests

      - name: Mypy
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          mypy app

      - name: Pytest
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.backend_dir.outputs.backend_dir }}"
          export PYTHONPATH="$PWD:${PYTHONPATH:-}"
          pytest -q
