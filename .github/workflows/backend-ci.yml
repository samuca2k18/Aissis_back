name: Backend CI

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/backend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -d assis_back ]; then cd assis_back; elif [ -d iassis-backend ]; then cd iassis-backend; fi
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          if [ -d assis_back ]; then cd assis_back; elif [ -d iassis-backend ]; then cd iassis-backend; fi
          ruff check app tests

      - name: Mypy
        run: |
          if [ -d assis_back ]; then cd assis_back; elif [ -d iassis-backend ]; then cd iassis-backend; fi
          mypy app

      - name: Pytest
        run: |
          if [ -d assis_back ]; then cd assis_back; elif [ -d iassis-backend ]; then cd iassis-backend; fi
          pytest -q
